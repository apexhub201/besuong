<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
  <title>BÉ SƯƠNG YÊU</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #2d1b3a 0%, #522546 50%, #8b2f5a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 20px;
      position: relative;
    }

    /* container chính */
    .container {
      background: rgba(255, 240, 245, 0.85);
      backdrop-filter: blur(25px);
      border-radius: 60px 60px 80px 60px;
      padding: 40px 30px 50px;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 40px 70px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(255, 192, 203, 0.6), 0 0 60px rgba(255, 105, 180, 0.5);
      text-align: center;
      transition: all 0.4s ease;
      position: relative;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.5);
      animation: floatGlow 4s infinite alternate ease-in-out;
    }

    @keyframes floatGlow {
      0% { box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 2px rgba(255,192,203,0.5), 0 0 50px #ff69b4; }
      100% { box-shadow: 0 45px 80px rgba(0,0,0,0.6), 0 0 0 3px rgba(255,182,193,0.8), 0 0 80px #ff1493; }
    }

    /* Chữ BÉ SƯƠNG YÊU */
    .title {
      font-size: clamp(2.8rem, 10vw, 4.5rem);
      font-weight: 800;
      background: linear-gradient(45deg, #ff0844, #ff6b9d, #ffb6c1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 4px;
      margin-bottom: 15px;
      text-shadow: 0 0 15px rgba(255, 182, 193, 0.7);
      animation: titleBeat 1.2s infinite alternate, softShine 2s infinite;
      filter: drop-shadow(0 8px 12px rgba(255, 20, 80, 0.4));
      word-break: break-word;
    }

    @keyframes titleBeat {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }
    @keyframes softShine {
      0% { filter: drop-shadow(0 0 8px #ff69b4); }
      50% { filter: drop-shadow(0 0 25px #ff1493); }
      100% { filter: drop-shadow(0 0 8px #ff69b4); }
    }

    /* Khu vực trái tim bay (canvas) */
    .hearts-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Nút BẤM */
    .btn-bam {
      background: #ff3366;
      border: none;
      color: white;
      font-size: 2rem;
      font-weight: bold;
      padding: 18px 50px;
      border-radius: 100px;
      cursor: pointer;
      background: linear-gradient(145deg, #ff1a4c, #d81b60);
      box-shadow: 0 18px 28px rgba(255, 20, 80, 0.6), 0 0 30px #ff8da1;
      letter-spacing: 4px;
      transition: 0.3s;
      margin: 25px 0 5px;
      border: 2px solid #ffe5f0;
      text-transform: uppercase;
      position: relative;
      z-index: 20;
      transform: scale(1);
      animation: gentlePulse 2s infinite;
    }

    .btn-bam:hover {
      background: #ff4d6d;
      box-shadow: 0 22px 38px #ff1744, 0 0 55px #ff8a80;
      transform: scale(1.08);
      letter-spacing: 5px;
    }

    .btn-bam:active {
      transform: scale(0.96);
      transition: 0.1s;
    }

    @keyframes gentlePulse {
      0% { box-shadow: 0 18px 28px rgba(255,20,80,0.6), 0 0 25px #ff8da1; }
      50% { box-shadow: 0 18px 38px rgba(255,20,80,0.9), 0 0 55px #ffb6c1; }
      100% { box-shadow: 0 18px 28px rgba(255,20,80,0.6), 0 0 25px #ff8da1; }
    }

    /* Khu vực hiển thị trái tim bằng chữ "sương dễ thương" */
    .heart-message-box {
      margin-top: 25px;
      background: rgba(255, 235, 240, 0.8);
      backdrop-filter: blur(20px);
      border-radius: 50px;
      padding: 25px 15px;
      border: 2px dashed #ff94b6;
      display: none; /* ẩn ban đầu */
      animation: fadeSlide 0.8s cubic-bezier(0.23, 1, 0.32, 1);
      box-shadow: 0 15px 35px rgba(255, 20, 80, 0.4);
    }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .ascii-heart {
      font-family: 'Courier New', 'Quicksand', monospace;
      font-weight: bold;
      color: #c2185b;
      background: #fff0f5;
      display: inline-block;
      padding: 15px 18px;
      border-radius: 70px;
      font-size: clamp(0.9rem, 3.2vw, 1.4rem);
      line-height: 1.5;
      white-space: pre;
      text-align: center;
      background: rgba(255, 240, 245, 0.9);
      box-shadow: inset 0 0 25px #ffb6c1, 0 10px 20px rgba(0,0,0,0.2);
      letter-spacing: 1px;
      margin: 5px 0;
      word-break: break-word;
      max-width: 100%;
      overflow-x: auto;
    }

    .wishes {
      margin-top: 20px;
      color: #4a0e2e;
      font-size: 1.3rem;
      font-weight: 600;
      background: #ffe8f0;
      border-radius: 40px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(233, 30, 99, 0.4);
      border-left: 8px solid #ff2d6e;
      line-height: 1.7;
      font-style: italic;
    }

    .wishes span {
      display: block;
      margin: 6px 0;
    }

    /* Trang trí trái tim nhỏ bay liên tục (không cần bấm) */
    .floating-hearts-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    @media (max-width: 500px) {
      .container {
        padding: 25px 15px 35px;
      }
      .btn-bam {
        font-size: 1.6rem;
        padding: 14px 35px;
      }
    }
  </style>
</head>
<body>

  <!-- Canvas cho trái tim bay nền tự động + khi bấm nút bùng nổ thêm -->
  <canvas id="heartCanvas" class="hearts-canvas"></canvas>

  <div class="container">
    <h1 class="title">BÉ SƯƠNG YÊU</h1>
    
    <button class="btn-bam" id="magicButton">BẤM</button>

    <!-- Trái tim làm bằng chữ "sương dễ thương" + lời chúc -->
    <div id="specialHeartBox" class="heart-message-box">
      <div class="ascii-heart" id="asciiHeartDisplay"></div>
      <div class="wishes">
        <span>Chúc Bé Sương luôn khoẻ mạnh, xinh đẹp</span>
        <span>Mỗi ngày trôi qua thật vui vẻ và hạnh phúc</span>
        <span>Nếu có gì buồn hay khó khăn, hãy nói anh nghe nhé</span>
        <span>Anh luôn ở đây lắng nghe và yêu thương bé</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ========== CANVAS TRÁI TIM BAY ==========
      const canvas = document.getElementById('heartCanvas');
      const ctx = canvas.getContext('2d');

      let width, height;
      let heartsArray = [];

      // Đối tượng trái tim bay
      class FloatingHeart {
        constructor(x, y, size, speedY, speedX, opacity, hue = 0) {
          this.x = x;
          this.y = y;
          this.size = size;
          this.speedY = speedY;
          this.speedX = speedX;
          this.opacity = opacity;
          this.hue = hue || Math.random() * 30 + 340; // từ hồng đến đỏ
          this.rotation = Math.random() * Math.PI * 2;
          this.rotationSpeed = (Math.random() - 0.5) * 0.02;
        }

        update() {
          this.y -= this.speedY;
          this.x += this.speedX;
          this.rotation += this.rotationSpeed;
          // nếu bay ra khỏi màn hình phía trên thì reset xuống dưới
          if (this.y < -50) {
            this.y = height + 50;
            this.x = Math.random() * width;
            this.opacity = Math.random() * 0.7 + 0.3;
          }
          if (this.x < -40) this.x = width + 20;
          if (this.x > width + 40) this.x = -20;
        }

        draw(ctx) {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          ctx.globalAlpha = this.opacity;
          ctx.fillStyle = `hsla(${this.hue}, 90%, 70%, 0.9)`;
          ctx.shadowColor = 'rgba(255, 50, 100, 0.7)';
          ctx.shadowBlur = 12;
          // vẽ hình trái tim bằng path
          ctx.beginPath();
          const s = this.size;
          ctx.moveTo(0, -s * 0.4);
          ctx.bezierCurveTo(-s * 0.55, -s * 0.9, -s * 1.1, -s * 0.3, 0, s * 0.5);
          ctx.bezierCurveTo(s * 1.1, -s * 0.3, s * 0.55, -s * 0.9, 0, -s * 0.4);
          ctx.fill();
          ctx.restore();
        }
      }

      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
      }

      // Khởi tạo trái tim nền bay liên tục
      function initHearts(count = 35) {
        heartsArray = [];
        for (let i = 0; i < count; i++) {
          const x = Math.random() * width;
          const y = Math.random() * height;
          const size = Math.random() * 28 + 12;
          const speedY = Math.random() * 1.7 + 0.6;
          const speedX = (Math.random() - 0.5) * 1.2;
          const opacity = Math.random() * 0.7 + 0.25;
          const hue = Math.random() * 30 + 335;
          heartsArray.push(new FloatingHeart(x, y, size, speedY, speedX, opacity, hue));
        }
      }

      // Thêm một loạt trái tim bùng nổ (khi bấm nút)
      function burstHearts(centerX, centerY, count = 25) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * 70 + 15;
          const x = centerX + Math.cos(angle) * dist;
          const y = centerY + Math.sin(angle) * dist;
          const size = Math.random() * 24 + 10;
          const speedY = Math.random() * 2.2 + 0.8;
          const speedX = (Math.random() - 0.5) * 2.4;
          const opacity = Math.random() * 0.8 + 0.4;
          heartsArray.push(new FloatingHeart(x, y, size, speedY, speedX, opacity, Math.random() * 20 + 345));
        }
      }

      function animateHearts() {
        ctx.clearRect(0, 0, width, height);
        heartsArray.forEach(heart => {
          heart.update();
          heart.draw(ctx);
        });
        requestAnimationFrame(animateHearts);
      }

      // ========== TẠO TRÁI TIM BẰNG CHỮ "sương dễ thương" ==========
      function generateAsciiHeartFromWord(word = "sương") {
        // Tạo hình trái tim bằng chính từ "sương"
        const s = word;
        const heartArt = [
          `    ${s}  ${s}        ${s}  ${s}    `,
          ` ${s}      ${s}    ${s}      ${s} `,
          `${s}        ${s}${s}        ${s}`,
          `${s}        ${s}        ${s}`,
          `  ${s}      ${s}      ${s}  `,
          `    ${s}    ${s}    ${s}    `,
          `      ${s}  ${s}  ${s}      `,
          `        ${s}${s}${s}        `,
          `          ${s}          `,
        ];
        return heartArt.join('\n');
      }

      function displayHeartAndWishes() {
        const box = document.getElementById('specialHeartBox');
        const asciiDiv = document.getElementById('asciiHeartDisplay');
        
        // Tạo trái tim từ chữ "sương" và thêm chữ "dễ thương"
        let heartText = generateAsciiHeartFromWord("sương");
        heartText += `\n   sương dễ thương`;
        asciiDiv.textContent = heartText;
        
        // Hiển thị box nếu đang ẩn
        if (box.style.display === 'none' || box.style.display === '') {
          box.style.display = 'block';
        } else {
          // Nếu đã hiện rồi thì vẫn giữ, nhưng có thể tạo hiệu ứng nhấp nháy nhẹ
          box.style.animation = 'none';
          box.offsetHeight; // trigger reflow
          box.style.animation = 'fadeSlide 0.6s ease';
        }
      }

      // ========== SỰ KIỆN NÚT BẤM ==========
      function setupButton() {
        const button = document.getElementById('magicButton');
        button.addEventListener('click', function(e) {
          // 1. Hiển thị trái tim bằng chữ sương dễ thương + lời chúc
          displayHeartAndWishes();

          // 2. Tạo bùng nổ trái tim bay từ vị trí nút (hoặc giữa màn hình)
          const rect = button.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          burstHearts(centerX, centerY, 32);
          
          // Thêm chút rung động nhẹ cho container
          const container = document.querySelector('.container');
          container.style.transform = 'scale(1.02)';
          setTimeout(() => { container.style.transform = 'scale(1)'; }, 150);
        });
      }

      // ========== KHỞI ĐỘNG ==========
      window.addEventListener('load', () => {
        resizeCanvas();
        initHearts(40);
        animateHearts();
        setupButton();
        
        // Ẩn box trái tim lúc đầu
        document.getElementById('specialHeartBox').style.display = 'none';
      });

      window.addEventListener('resize', () => {
        resizeCanvas();
      });

      // Thêm một ít trái tim ngẫu nhiên khi di chuột (tùy chọn)
      window.addEventListener('mousemove', (e) => {
        if (Math.random() < 0.08) { // thỉnh thoảng thêm trái tim nhỏ theo chuột
          heartsArray.push(new FloatingHeart(
            e.clientX, 
            e.clientY, 
            Math.random() * 16 + 6, 
            Math.random() * 1.2 + 0.3, 
            (Math.random() - 0.5) * 0.9, 
            0.7, 
            350
          ));
        }
      });

      // Giới hạn số lượng trái tim để không quá nặng
      setInterval(() => {
        if (heartsArray.length > 130) {
          heartsArray = heartsArray.slice(-110);
        }
      }, 2000);
    })();
  </script>
</body>
</html>
